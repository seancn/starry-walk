<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>星夜漫游 · Van Gogh</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#07122d;color:#ffe8aa;font-family:system-ui}canvas{display:block;touch-action:none}#hud{position:absolute;top:14px;left:15px;pointer-events:none;text-shadow:0 2px 8px #000}h1{font-size:20px;margin:0}small{font-size:12px}#joy{position:absolute;bottom:25px;left:22px;width:115px;height:115px;border:2px solid #ffffff55;border-radius:50%;background:#ffffff14;touch-action:none}#knob{position:absolute;left:37px;top:37px;width:38px;height:38px;border-radius:50%;background:#f8d88bcc}button{position:absolute;bottom:52px;right:25px;border:1px solid #f9dc94;background:#102955cc;color:#ffe8aa;border-radius:30px;padding:15px 20px;font-size:16px}#hint{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);font-size:11px;white-space:nowrap;color:#fff9}</style></head><body><div id="hud"><h1>✦ 星夜漫游</h1><small>梵高《星空》灵感 · 第三人称探索</small></div><div id="joy"><div id="knob"></div></div><button id="fly">✦ 飞翔</button><div id="hint">左侧移动 · 右侧转动视角 · 点击飞翔</div><script type="module">import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';const scene=new T.Scene();scene.background=new T.Color(0x07132f);scene.fog=new T.FogExp2(0x07132f,.005);const camera=new T.PerspectiveCamera(68,innerWidth/innerHeight,.1,1800);const renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.outputColorSpace=T.SRGBColorSpace;document.body.prepend(renderer.domElement);scene.add(new T.HemisphereLight(0x9ab9ff,0x14211a,2));const sun=new T.DirectionalLight(0xffd68c,2);sun.position.set(80,130,-90);scene.add(sun);const mat=(c,e=0)=>new T.MeshStandardMaterial({color:c,roughness:.95,emissive:c,emissiveIntensity:e});const blue=mat(0x1b416b),dark=mat(0x102d39),gold=mat(0xf8c95e,.65);function mesh(g,m,x,y,z){let o=new T.Mesh(g,m);o.position.set(x,y,z);scene.add(o);return o}function terrain(x,z){return Math.sin(x*.014)*9+Math.cos(z*.018)*7+Math.sin((x+z)*.012)*5}const geo=new T.PlaneGeometry(1500,1500,90,90);geo.rotateX(-Math.PI/2);let p=geo.attributes.position;for(let i=0;i<p.count;i++)p.setY(i,terrain(p.getX(i),p.getZ(i))-7);geo.computeVertexNormals();mesh(geo,blue,0,0,0);const starGroup=new T.Group();scene.add(starGroup);const sphere=new T.SphereGeometry(1,12,10);for(let i=0;i<270;i++){let a=Math.random()*Math.PI*2,r=90+Math.random()*520,y=70+Math.random()*230;let s=new T.Mesh(sphere,Math.random()>.22?gold:mat(0xc1dfff,.7));s.position.set(Math.cos(a)*r,y,Math.sin(a)*r);s.scale.setScalar(1.5+Math.random()*4);starGroup.add(s)}function swirl(cx,cy,cz,r){let points=[];for(let i=0;i<500;i++){let t=i/499,angle=t*Math.PI*11,rad=r*(1-t);points.push(new T.Vector3(cx+Math.cos(angle)*rad,cy+Math.sin(angle)*rad,cz+Math.sin(angle*2)*5))}let line=new T.Line(new T.BufferGeometry().setFromPoints(points),new T.LineBasicMaterial({color:0x6ca6d4,transparent:true,opacity:.75}));scene.add(line);return line}let swirls=[swirl(-110,160,-230,105),swirl(150,220,-350,140),swirl(0,240,-550,130)];let moon=mesh(new T.SphereGeometry(24,24,16),mat(0xffdc72,1.8),220,190,-350);function house(x,z){let y=terrain(x,z)-7;mesh(new T.BoxGeometry(15,13,14),mat(0x28415b),x,y+6,z);let roof=mesh(new T.ConeGeometry(12,9,4),mat(0x11233e),x,y+17,z);roof.rotation.y=Math.PI/4;for(let dx of [-4,4])mesh(new T.PlaneGeometry(2,3),gold,x+dx,y+7,z+7.1)}for(let i=0;i<35;i++){let x=(Math.random()-.5)*310,z=-90-Math.random()*200;house(x,z)}function tree(x,z,h){let y=terrain(x,z)-7;mesh(new T.CylinderGeometry(.7,1.5,h*.6,7),dark,x,y+h*.3,z);for(let k=0;k<3;k++)mesh(new T.ConeGeometry(h*(.15-k*.035),h*.65,7),mat(k%2?0x102f2d:0x183f3c),x,y+h*(.55+k*.16),z)}for(let i=0;i<45;i++)tree((Math.random()-.5)*420,-60-Math.random()*340,16+Math.random()*45);tree(-42,-60,95);const player=new T.Group();scene.add(player);let body=new T.Mesh(new T.CapsuleGeometry(2.7,9,5,10),mat(0x9b784e));body.position.y=8;player.add(body);let head=new T.Mesh(new T.SphereGeometry(3.2,12,10),mat(0xf0bd83));head.position.y=16;player.add(head);let hat=new T.Mesh(new T.CylinderGeometry(5,4,2,16),mat(0x293b52));hat.position.y=19;player.add(hat);let brim=new T.Mesh(new T.CylinderGeometry(7,7,.7,16),mat(0x293b52));brim.position.y=18;player.add(brim);let pos=new T.Vector3(0,0,45),yaw=0,pitch=.2,flying=false,up=0,joyX=0,joyY=0,keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.querySelector('#fly').onclick=()=>{flying=!flying;document.querySelector('#fly').textContent=flying?'↓ 降落':'✦ 飞翔'};const joy=document.querySelector('#joy'),knob=document.querySelector('#knob');let jid=null;function stick(e){let b=joy.getBoundingClientRect(),dx=e.clientX-(b.left+b.width/2),dy=e.clientY-(b.top+b.height/2),l=Math.max(1,Math.hypot(dx,dy)),m=Math.min(42,l);joyX=dx/l*m/42;joyY=dy/l*m/42;knob.style.transform='translate('+joyX*42+'px,'+joyY*42+'px)'}joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(jid);stick(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)stick(e)});function reset(e){if(e.pointerId===jid){jid=null;joyX=joyY=0;knob.style.transform=''}}joy.addEventListener('pointerup',reset);joy.addEventListener('pointercancel',reset);let look=null,lastX=0,lastY=0;renderer.domElement.addEventListener('pointerdown',e=>{look=e.pointerId;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(look)});renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId!==look)return;yaw-=(e.clientX-lastX)*.005;pitch=Math.max(-.45,Math.min(.95,pitch+(e.clientY-lastY)*.004));lastX=e.clientX;lastY=e.clientY});renderer.domElement.addEventListener('pointerup',()=>look=null);const clock=new T.Clock();function tick(){requestAnimationFrame(tick);let dt=Math.min(.05,clock.getDelta()),forward=-(joyY+(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0)),side=joyX+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),speed=(flying?55:24)*dt;pos.x+=(Math.sin(yaw)*forward+Math.cos(yaw)*side)*speed;pos.z+=(-Math.cos(yaw)*forward+Math.sin(yaw)*side)*speed;let ground=terrain(pos.x,pos.z)-7;if(flying)up=Math.min(200,up+dt*13);else up=Math.max(0,up-dt*20);pos.y=ground+up;player.position.copy(pos);player.rotation.y=yaw;const target=pos.clone().add(new T.Vector3(-Math.sin(yaw)*28*Math.cos(pitch),17+Math.sin(pitch)*30,-Math.cos(yaw)*-28*Math.cos(pitch)));camera.position.lerp(target,.075);camera.lookAt(pos.x,pos.y+13,pos.z);starGroup.rotation.y+=dt*.001;for(let s of swirls)s.rotation.z+=dt*.001;renderer.render(scene,camera)}tick();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})</script></body></html>
