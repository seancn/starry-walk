<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>星夜漫游 · Van Gogh</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061331;color:#ffe6a0;font-family:system-ui}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}#hud{position:fixed;top:14px;left:15px;pointer-events:none;text-shadow:0 2px 8px #000}h1{font-size:20px;margin:0 0 7px}small{font-size:12px}#joy{position:fixed;bottom:35px;left:22px;width:116px;height:116px;border:2px solid #ffffff66;border-radius:50%;background:#ffffff16;touch-action:none}#knob{position:absolute;left:37px;top:37px;width:38px;height:38px;border-radius:50%;background:#f8d88bcc}button{position:fixed;bottom:62px;right:22px;border:1px solid #f9dc94;background:#102955cc;color:#ffe8aa;border-radius:30px;padding:15px 20px;font-size:16px}#hint{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);font-size:11px;white-space:nowrap;color:#fff9}</style></head><body><canvas id="world"></canvas><div id="hud"><h1>✦ 星夜漫游</h1><small>梵高《星空》灵感 · 第三人称探索</small></div><div id="joy"><div id="knob"></div></div><button id="fly">✦ 飞翔</button><div id="hint">左侧移动 · 右侧转动视角 · 点击飞翔</div><script>
(()=>{'use strict';const c=document.querySelector('#world'),ctx=c.getContext('2d',{alpha:false});if(!ctx){document.querySelector('#hint').textContent='浏览器不支持 Canvas';return}let W=0,H=0,dpr=1,t=0,x=0,z=0,yaw=0,pitch=0,alt=0,flying=false,jx=0,jy=0,keys={},lookId=null,lastX=0,lastY=0;const rnd=(n)=>{let v=Math.sin(n*127.1+4.1)*43758.5453;return v-Math.floor(v)};const stars=Array.from({length:165},(_,i)=>({a:rnd(i+1)*6.283,h:.14+rnd(i+400)*.65,r:1+rnd(i+800)*3.2}));const houses=Array.from({length:75},(_,i)=>({x:(rnd(i+1700)-.5)*700,z:65+rnd(i+2100)*780,h:13+rnd(i+2300)*19}));const trees=Array.from({length:90},(_,i)=>({x:(rnd(i+2700)-.5)*800,z:50+rnd(i+2900)*850,h:18+rnd(i+3100)*65}));function resize(){dpr=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function line(points,color,width=2){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke()}function ellipse(px,py,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(px,py,Math.max(.1,rx),Math.max(.1,ry),0,0,6.283);ctx.fill()}function project(wx,wz,wy=0){let dx=wx-x,dz=wz-z,forward=dx*Math.sin(yaw)+dz*Math.cos(yaw),side=dx*Math.cos(yaw)-dz*Math.sin(yaw);if(forward<2)return null;let sc=Math.min(10,550/(forward+30)),horizon=H*.55+pitch*H*.5-alt*1.5;return [W*.5+side*sc,horizon+(alt-wy)*sc,sc,forward]}function hillHeight(wx,wz){return 10*Math.sin(wx*.008)+7*Math.cos(wz*.01)+5*Math.sin((wx+wz)*.012)}function sky(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#06122f');g.addColorStop(.5,'#174474');g.addColorStop(1,'#0b2343');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);let hor=H*.55+pitch*H*.5-alt*1.5;for(let i=0;i<95;i++){let sy=(i*67.71+t*.08)%Math.max(1,H*.74),sx=(i*139.31+Math.sin(t*.001+i)*18)%W;line([[sx-60,sy+10],[sx-24,sy],[sx+32,sy-9],[sx+85,sy+4]],i%3?'#38699a33':'#7eacb433',2+i%5)}for(let s of stars){let a=s.a-yaw*.3,px=((a/6.283+1)%1)*W,py=s.h*H+pitch*H*.2;let glow=ctx.createRadialGradient(px,py,1,px,py,s.r*8);glow.addColorStop(0,'#fff4bd');glow.addColorStop(.18,'#ffdd72c0');glow.addColorStop(1,'#ffd95700');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(px,py,s.r*8,0,6.283);ctx.fill();ellipse(px,py,s.r,s.r,'#fff4b9')}for(let k=0;k<3;k++){let cx=W*(.22+k*.35)-yaw*25,cy=H*(.24+k*.09)+pitch*H*.15,r=Math.min(W,H)*(.14+k*.035);for(let j=0;j<4;j++){let pts=[];for(let i=0;i<100;i++){let u=i/99,ang=u*Math.PI*7+t*.00008+k,rad=r*(1-u)*(1-j*.11);pts.push([cx+Math.cos(ang)*rad,cy+Math.sin(ang)*rad*.55])}line(pts,j%2?'#b5c8ac77':'#5da4d2aa',2+j*2)}}let mx=W*.79-yaw*15,my=H*.2+pitch*H*.12;ellipse(mx,my,29,29,'#ffdb6d');ellipse(mx+12,my-9,26,27,'#0c2a55')}function land(){let hor=H*.55+pitch*H*.5-alt*1.5;let p=[];for(let i=0;i<=60;i++){let sx=i/60*W,worldX=x+(i-30)*25,hy=hillHeight(worldX,z+420);p.push([sx,hor+22-hy*.8])}ctx.fillStyle='#173f4a';ctx.beginPath();ctx.moveTo(0,H);p.forEach(q=>ctx.lineTo(...q));ctx.lineTo(W,H);ctx.fill();for(let j=0;j<22;j++){let dep=1000-j*42;let pts=[];for(let i=0;i<=32;i++){let xx=x+(i-16)*dep/15,pr=project(xx,z+dep,hillHeight(xx,z+dep));if(pr)pts.push([pr[0],pr[1]])}if(pts.length>1)line(pts,j%3?'#1f5960':'#34747a',3+j*.25)}}function drawTree(q){let p=project(q.x,q.z,hillHeight(q.x,q.z));if(!p||p[0]<-100||p[0]>W+100)return;let [sx,sy,sc]=p,h=q.h*sc;if(h<1)return;line([[sx,sy],[sx,sy-h]],'#18312e',Math.max(1,sc*3));for(let j=0;j<3;j++){let cy=sy-h*(.4+j*.18),rw=h*(.17-j*.025);ctx.fillStyle=j%2?'#123a37':'#174b43';ctx.beginPath();ctx.moveTo(sx,cy-h*.35);ctx.lineTo(sx-rw,cy+h*.23);ctx.lineTo(sx+rw,cy+h*.23);ctx.fill();line([[sx-rw,cy+h*.2],[sx,cy-h*.35],[sx+rw,cy+h*.2]],'#356d63',Math.max(1,sc))}}function drawHouse(q){let p=project(q.x,q.z,hillHeight(q.x,q.z));if(!p||p[0]<-100||p[0]>W+100)return;let [sx,sy,sc]=p,w=16*sc,h=q.h*sc;if(w<.5)return;ctx.fillStyle='#2d425b';ctx.fillRect(sx-w/2,sy-h,w,h);ctx.fillStyle='#182c47';ctx.beginPath();ctx.moveTo(sx-w*.7,sy-h);ctx.lineTo(sx,sy-h-h*.4);ctx.lineTo(sx+w*.7,sy-h);ctx.fill();ctx.fillStyle='#ffd57c';ctx.fillRect(sx-w*.24,sy-h*.7,Math.max(1,w*.15),Math.max(1,h*.23));ctx.fillRect(sx+w*.14,sy-h*.7,Math.max(1,w*.15),Math.max(1,h*.23))}function traveler(){let bx=W*.5,by=H*.77-alt*.18,bob=Math.sin(t*.01)*2;ellipse(bx,by+16,17,5,'#09192788');line([[bx-6,by-4+bob],[bx-8,by+16+bob]],'#26364c',6);line([[bx+6,by-4+bob],[bx+8,by+16+bob]],'#26364c',6);ellipse(bx,by-24+bob,12,20,'#8d704f');ellipse(bx,by-49+bob,9,10,'#e4b77e');ellipse(bx,by-58+bob,19,4,'#263951');ctx.fillStyle='#263951';ctx.fillRect(bx-12,by-66+bob,24,9)}function frame(){t++;sky();land();let objects=houses.map(q=>({...q,type:0})).concat(trees.map(q=>({...q,type:1}))).filter(q=>{let p=project(q.x,q.z);return p&&p[3]<1000}).sort((a,b)=>{let da=(a.x-x)**2+(a.z-z)**2,db=(b.x-x)**2+(b.z-z)**2;return db-da});for(let q of objects)q.type?drawTree(q):drawHouse(q);traveler();let fw=-jy+(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0),sd=jx+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);let speed=flying?1.9:.85;x+=(Math.sin(yaw)*fw+Math.cos(yaw)*sd)*speed;z+=(Math.cos(yaw)*fw-Math.sin(yaw)*sd)*speed;if(flying)alt=Math.min(160,alt+.25);else alt=Math.max(0,alt-.5);requestAnimationFrame(frame)}requestAnimationFrame(frame);addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.querySelector('#fly').onclick=()=>{flying=!flying;document.querySelector('#fly').textContent=flying?'↓ 降落':'✦ 飞翔'};const joy=document.querySelector('#joy'),knob=document.querySelector('#knob');let jid=null;function stick(e){let b=joy.getBoundingClientRect(),dx=e.clientX-(b.left+b.width/2),dy=e.clientY-(b.top+b.height/2),l=Math.max(1,Math.hypot(dx,dy)),m=Math.min(42,l);jx=dx/l*m/42;jy=dy/l*m/42;knob.style.transform='translate('+jx*42+'px,'+jy*42+'px)'}joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(jid);stick(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)stick(e)});function reset(e){if(e.pointerId===jid){jid=null;jx=jy=0;knob.style.transform=''}}joy.addEventListener('pointerup',reset);joy.addEventListener('pointercancel',reset);c.addEventListener('pointerdown',e=>{lookId=e.pointerId;lastX=e.clientX;lastY=e.clientY;c.setPointerCapture(lookId)});c.addEventListener('pointermove',e=>{if(e.pointerId!==lookId)return;yaw-=(e.clientX-lastX)*.005;pitch=Math.max(-.65,Math.min(.65,pitch+(e.clientY-lastY)*.004));lastX=e.clientX;lastY=e.clientY});c.addEventListener('pointerup',()=>lookId=null);window.addEventListener('error',e=>{document.querySelector('#hint').textContent='运行异常：'+e.message});})();
</script></body></html>
